jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/*Application*",
                    "**/*Request*",
                    "**/*Response*",
                    "**/*Dto*",
                    "**/ErrorCode*",
                    "**/config/**",
                    "**/mapper/**"
            ])
        }))
    }
}
