spring:
  application:
    name: bid-auction

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          default_batch_fetch_size: 100
      open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  session:
    store-type: redis

  cache:
    type: simple
